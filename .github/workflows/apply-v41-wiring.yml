name: Apply VERA 4.1 wiring

on:
  push:
    branches:
      - milestone-5-vera-4-1-containment-night
    paths:
      - scripts/apply-v41-master.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-5-vera-4-1-containment-night
      - name: Apply Containment Night wiring
        run: node scripts/apply-v41-master.mjs
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/render/WorldRenderer.ts src/omega-os/OmegaOS.ts src/app/Game.ts
          git diff --cached --quiet && exit 0
          git commit -m "M5: wire VERA 4.1 Containment Night runtime"
          git push
