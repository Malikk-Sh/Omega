<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OMEGA UI Kit</title>
<link rel="stylesheet" href="../styles/omega-ui-tokens.css">
<link rel="stylesheet" href="../styles/omega-ui-components.css">
<link rel="stylesheet" href="../css/v2/omega-ui.css">
<style>
body{margin:0;min-height:100dvh;background:#050a10}.demo{padding:18px;display:grid;gap:14px}.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.demo-card{padding:14px;min-height:180px;position:relative;overflow:hidden}.demo-title{font:700 12px var(--omega-font-mono);letter-spacing:.12em;color:var(--omega-muted);margin:0 0 12px}.demo .omega-window{position:relative;width:100%;height:300px;max-width:none;max-height:none}.demo-actions{display:flex;flex-wrap:wrap;gap:8px}.demo-mount{min-height:140px}.demo .omega-dialogue{position:relative;inset:auto}.demo .omega-core-decision,.demo .omega-boot,.demo .omega-chapter-card{position:relative;inset:auto;min-height:300px}.demo .omega-evidence{height:300px}
</style>
</head>
<body class="omega-ui">
<main class="demo">
  <h1 style="margin:0;font:600 clamp(22px,5vw,36px) var(--omega-font-mono)">OMEGA / UI KIT v2.1</h1>
  <div class="demo-actions">
    <button id="toast" class="omega-button">Toast</button>
    <button id="corrupt" class="omega-button" data-tone="danger">NULL mode</button>
    <button id="show-settings" class="omega-button">Settings modal</button>
    <button id="show-chapter" class="omega-button">Chapter card</button>
  </div>
  <section class="demo-grid">
    <article class="omega-panel demo-card"><h2 class="demo-title">WINDOW / TERMINAL</h2><div id="terminal-window"></div></article>
    <article class="omega-panel demo-card"><h2 class="demo-title">DIALOGUE</h2><div id="dialogue"></div></article>
    <article class="omega-panel demo-card"><h2 class="demo-title">EXPLORER</h2><div id="explorer" class="demo-mount"></div></article>
    <article class="omega-panel demo-card"><h2 class="demo-title">TASK MANAGER</h2><div id="processes"></div></article>
    <article class="omega-panel demo-card"><h2 class="demo-title">EVIDENCE / TOUCH ZOOM</h2><div id="evidence"></div></article>
    <article class="omega-panel demo-card"><h2 class="demo-title">BOOT / RECOVERY</h2><div id="boot"></div></article>
    <article class="omega-panel demo-card"><h2 class="demo-title">SAVE SLOTS</h2><div id="saves"></div></article>
    <article class="omega-panel demo-card"><h2 class="demo-title">CORE DECISION</h2><div id="core"></div></article>
  </section>
</main>
<script type="module" src="./ui-kit.js"></script>
</body></html>
