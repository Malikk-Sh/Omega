<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OMEGA UI Kit</title>
<link rel="stylesheet" href="../styles/omega-ui-tokens.css">
<link rel="stylesheet" href="../styles/omega-ui-components.css">
<link rel="stylesheet" href="../css/v2/omega-ui.css">
<style>body{margin:0;min-height:100dvh;background:#050a10}.demo{padding:18px;display:grid;gap:14px}.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.demo-card{padding:14px;min-height:180px;position:relative}.demo-title{font:700 12px var(--omega-font-mono);letter-spacing:.12em;color:var(--omega-muted);margin:0 0 12px}.demo .omega-window{position:relative;width:100%;height:260px;max-width:none;max-height:none}.demo-actions{display:flex;flex-wrap:wrap;gap:8px}</style>
</head>
<body class="omega-ui">
<main class="demo">
  <h1 style="margin:0;font:600 clamp(22px,5vw,36px) var(--omega-font-mono)">OMEGA / UI KIT v2</h1>
  <div class="demo-actions"><button id="toast" class="omega-button">Показать уведомление</button><button id="corrupt" class="omega-button" data-tone="danger">NULL режим</button></div>
  <section class="demo-grid">
    <article class="omega-panel demo-card"><h2 class="demo-title">WINDOW / TERMINAL</h2><div id="terminal-window"></div></article>
    <article class="omega-panel demo-card"><h2 class="demo-title">DIALOGUE</h2><div id="dialogue"></div></article>
    <article class="omega-panel demo-card"><h2 class="demo-title">CONTROLS</h2><div class="demo-actions"><button class="omega-button">Обычная</button><button class="omega-button" data-tone="danger">Удалить</button><input class="omega-input" placeholder="Введите команду..."></div><div class="omega-progress" style="margin-top:14px;--progress:63%"><span></span></div></article>
    <article class="omega-panel demo-card"><h2 class="demo-title">PROCESS LIST</h2><div class="omega-process-list"><div class="omega-process"><b>kernel</b><span>2%</span><span>18 MB</span><button class="omega-icon-button">•••</button></div><div class="omega-process" data-anomaly="true"><b>NULL</b><span>??</span><span>??</span><button class="omega-icon-button">•••</button></div></div></article>
  </section>
</main>
<script type="module" src="./ui-kit.js"></script>
</body></html>
