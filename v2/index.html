<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090b12">
  <title>OMEGA — Milestone 0</title>
  <link rel="stylesheet" href="./milestone0.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="m0-world" aria-label="3D test apartment"></canvas>

  <header class="m0-hud">
    <div><strong>OMEGA / M0</strong><small>WORLD ↔ FILESYSTEM ↔ SAVE</small></div>
    <span class="m0-binding" data-binding-status>PHOTO BINDING: ...</span>
  </header>

  <section class="m0-instructions" aria-label="Milestone instructions">
    <strong>Architecture prototype</strong>
    <span>Открой OMEGA OS → удали <code>/memories/test_photo.img</code> → рамка исчезнет со стены.</span>
    <span>Перезагрузи страницу: состояние восстановится из IndexedDB.</span>
    <button type="button" data-open-os>Открыть OMEGA OS</button>
  </section>

  <div class="m0-touch" aria-label="Touch controls">
    <div class="m0-move" data-m0-move aria-label="Move joystick">
      <img src="../assets/v2/ui/touch/joystick_base.svg" alt="">
      <img class="m0-move-knob" data-m0-move-knob src="../assets/v2/ui/touch/joystick_knob.svg" alt="">
    </div>
    <div class="m0-look" data-m0-look aria-label="Look area"></div>
    <div class="m0-actions">
      <button type="button" data-m0-action="interact" aria-label="Interact"><img src="../assets/v2/ui/touch/action_interact.svg" alt=""></button>
      <button type="button" data-m0-action="os" aria-label="OMEGA OS"><img src="../assets/v2/ui/touch/action_os.svg" alt=""></button>
      <button type="button" data-m0-action="pause" aria-label="Pause"><img src="../assets/v2/ui/touch/action_pause.svg" alt=""></button>
    </div>
  </div>

  <div id="m0-os" class="m0-os" hidden aria-hidden="true"></div>
  <div id="m0-toast" class="m0-toast" role="status" aria-live="polite"></div>
  <pre id="m0-fatal" class="m0-fatal" hidden></pre>

  <script type="module" src="../js/v2/m0/main.js"></script>
</body>
</html>
