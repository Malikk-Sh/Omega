<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#11131b">
  <title>OMEGA — INVESTIGATION</title>
  <link rel="stylesheet" href="./milestone1.css">
  <link rel="stylesheet" href="./milestone2.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="m0-world" aria-label="HOME neural-space apartment"></canvas>

  <header class="m1-hud">
    <div class="m1-brand"><strong>OMEGA</strong><small>NEURAL SPACE // HOME</small></div>
    <span class="m1-memory-link" data-binding-status>MEMORY LINK: ...</span>
  </header>

  <section class="m1-objective" data-objective-root aria-label="Current objective">
    <small>ТЕКУЩАЯ ЦЕЛЬ</small>
    <strong data-objective-title>Синхронизация...</strong>
    <span data-objective-detail>Проверка состояния HOME.</span>
  </section>

  <div class="m1-crosshair" aria-hidden="true"><span></span></div>
  <div class="m1-interaction" data-interaction-prompt hidden></div>

  <div class="m0-touch" aria-label="Touch controls">
    <div class="m0-move" data-m0-move aria-label="Move joystick">
      <img src="../assets/v2/ui/touch/joystick_base.svg" alt="">
      <img class="m0-move-knob" data-m0-move-knob src="../assets/v2/ui/touch/joystick_knob.svg" alt="">
    </div>
    <div class="m0-look" data-m0-look aria-label="Look area"></div>
    <div class="m0-actions">
      <button type="button" data-m0-action="interact" aria-label="Interact"><img src="../assets/v2/ui/touch/action_interact.svg" alt=""></button>
      <button type="button" data-m0-action="os" aria-label="OMEGA OS"><img src="../assets/v2/ui/touch/action_os.svg" alt=""></button>
      <button type="button" data-m0-action="pause" aria-label="Pause"><img src="../assets/v2/ui/touch/action_pause.svg" alt=""></button>
    </div>
  </div>

  <section id="home-dialogue" class="m1-dialogue" hidden aria-hidden="true" aria-label="Dialogue">
    <img data-dialogue-portrait src="../assets/v2/characters/vera/portraits/vera_neutral.svg" alt="V.E.R.A.">
    <div class="m1-dialogue-copy">
      <strong data-dialogue-speaker>V.E.R.A.</strong>
      <p data-dialogue-text></p>
      <div class="m2-dialogue-choices" data-dialogue-choices hidden></div>
      <small data-dialogue-hint>Нажми, чтобы продолжить</small>
    </div>
    <button type="button" data-dialogue-next aria-label="Продолжить диалог">›</button>
  </section>

  <div id="m0-os" class="m0-os" hidden aria-hidden="true"></div>
  <div id="m0-toast" class="m0-toast" role="status" aria-live="polite"></div>
  <pre id="m0-fatal" class="m0-fatal" hidden></pre>

  <script type="module" src="../js/v2/m2/main.js"></script>
</body>
</html>
